<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="随机抽一个中文概念，准备 10 分钟，用自己的话讲 1 分钟。">
  <title>一分钟即兴表达</title>
  <link rel="stylesheet" href="styles.css">
  <script src="topics.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="practice">
    <header class="intro">
      <h1>一分钟即兴表达</h1>
      <p>抽一个概念，准备 10 分钟，用自己的话讲 1 分钟。</p>
    </header>

    <div class="practice-grid">
      <section class="topic-card" aria-labelledby="topic-label">
        <h2 id="topic-label">本轮话题</h2>
        <p id="topic" aria-live="polite">准备好了吗？</p>
        <button id="draw" class="secondary" type="button">随机抽题</button>
      </section>

      <section class="timer-card" aria-labelledby="phase">
        <ol class="stages" aria-label="练习阶段">
          <li data-phase="ready" aria-current="step">抽题</li>
          <li data-phase="prepare">准备</li>
          <li data-phase="speak">讲述</li>
        </ol>
        <div class="dial" id="dial">
          <p class="phase" id="phase" aria-live="polite">等待抽题</p>
          <p class="countdown" id="countdown" role="timer" aria-label="剩余时间">10:00</p>
        </div>
        <p id="hint" class="hint">准备 10 分钟，讲述 1 分钟</p>
        <div class="actions">
          <button id="advance" class="primary" type="button" disabled>开始准备</button>
        </div>
      </section>
    </div>

    <div class="practice-tools">
      <details class="custom-topics">
        <summary>添加自己的题目</summary>
        <p id="custom-topic-help">自定义题目保存在当前浏览器，也会参与随机抽题。</p>
        <form id="custom-topic-form">
          <label for="custom-topic">题目名称</label>
          <div class="topic-entry">
            <input id="custom-topic" type="text" maxlength="40" required autocomplete="off"
              placeholder="输入一个概念或名词短语" aria-describedby="custom-topic-help custom-topic-status">
            <button class="primary" type="submit">添加题目</button>
          </div>
          <p id="custom-topic-status" role="status"></p>
        </form>
      </details>
      <button id="reset-progress" class="quiet-button" type="button">重置抽题进度</button>
    </div>

    <dialog id="reset-dialog" class="reset-dialog" aria-labelledby="reset-title" aria-describedby="reset-description">
      <form method="dialog">
        <h2 id="reset-title">重置抽题进度？</h2>
        <p id="reset-description">重置会结束当前练习，并让已抽过的题重新参与抽取。你添加的题目会保留。</p>
        <div class="dialog-actions">
          <button class="quiet-button" type="submit" value="cancel" autofocus>取消</button>
          <button class="primary" type="submit" value="reset">确认重置</button>
        </div>
      </form>
    </dialog>
  </main>
</body>
</html>
